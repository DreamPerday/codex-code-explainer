name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Package both editions
        if: runner.os == 'Windows'
        run: |
          npm run package:web
          npm run package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: code-explainer-packages
          path: dist/code-explainer-*.zip
          if-no-files-found: error
